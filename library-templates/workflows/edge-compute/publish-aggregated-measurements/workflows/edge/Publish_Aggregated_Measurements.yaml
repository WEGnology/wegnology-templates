      - config:
          hostTemplate: ':memory:'
          query: "SELECT attribute,value as inst, Max(value) as max, min(value) as min, avg(value) as avg FROM measures \r\nWHERE\r\n    timestamp >= ( {{wk.timestamp}} - 300000)\r\nGROUP BY attribute \r\nORDER BY timestamp desc"
