        id: d_DjgL6_ZL
        meta:
          category: data
          description: ''
          groupId: 6gHFQFDlSQ
          label: Get measures
          name: sql
          x: 260
          'y': 320
        outputIds:
          - - fG449oPPQj
        type: SqlNode
      - config:
          expression: >-
            {{ wk.peripheral.db.[0] }} !== "success" && {{
            wk.peripheral.db.errors }} === undefined
        id: fG449oPPQj
        meta:
          category: logic
          description: ''
          groupId: 6gHFQFDlSQ
          label: Erros?
          name: conditional
          x: 260
          'y': 400
        outputIds:
          - - Ua4a7OrF7Z
          - - 5lHrlsZ5_y
        type: ConditionalNode
      - config:
          scopePath: ''
          script: |-
            var arraySQL = payload.wk.peripheral.db;
            let attributes = payload.wk.peripheral.value.attributes;
            let state = {};

            for(let att in arraySQL){
                if(arraySQL[att] !== undefined){
                    let index = attributes.findIndex(x => x.name === arraySQL[att].attribute);

                    if(index !== -1){
                        let aggregation = attributes[index].attributeTags.aggregation;

                        if(aggregation !== undefined && arraySQL[att][aggregation] !== undefined) state[arraySQL[att].attribute] = arraySQL[att][aggregation];
                    }
                }
            }
            payload.attribute = state;
        id: 5lHrlsZ5_y
        meta:
          category: logic
          description: ''
          groupId: 6gHFQFDlSQ
          label: Function
          name: function
          x: 340
          'y': 500
