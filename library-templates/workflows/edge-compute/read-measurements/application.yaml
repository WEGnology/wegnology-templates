      Template responsible for reading measurements from an Edge Compute device
      every 30 seconds.
    filesPath: ./files
    globals:
      - cloudOnly: false
        json: '"edge,read"'
        key: template-keywords
    id: >-
      ~exportplaceholderid-application-libraryWorkflowsEdgeComputeReadMeasurements~
