          label: 'Peripheral: Get'
          name: get-peripheral
          x: 140
          'y': 240
        outputIds:
          - - qOgPL17Cfs
        type: GetPeripheralNode
      - config:
          scopePath: ''
          script: |-
            let attRead = [];

            if(payload.wk.peripherals[0] !== undefined){
                let attributes = payload.wk.peripherals[0].attributes;
                for(let i in attributes){
                    let obj = {};

                    if(attributes[i].attributeTags.type !== undefined && attributes[i].attributeTags.type !== null) {
                        obj["type"] = attributes[i].attributeTags.function;

                        if(attributes[i].attributeTags.type.includes("32") || attributes[i].attributeTags.type.includes("float")) obj["length"] = 2;
                        else obj["length"] = 1;

                        obj["key"] = "t"+i;
                    }
                    if(attributes[i].attributeTags.address !== undefined && attributes[i].attributeTags.address !== null) obj["address"] = attributes[i].attributeTags.address;
                    attRead.push(obj)   
                }
            } 

            payload.wk.instructions = attRead;
        id: qOgPL17Cfs
        meta:
          category: logic
          description: ''
          label: Function
          name: function
          x: 140
          'y': 320
