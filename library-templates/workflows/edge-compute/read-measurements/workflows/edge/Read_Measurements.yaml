      - config:
          expression: '{{ wk.peripheral.result.errors }} === undefined'
        id: eKx_FEGp_z
        meta:
          category: logic
          description: ''
          groupId: jatxjzRJnK
          label: Error?
          name: conditional
          x: 240
          'y': 240
        outputIds:
          - - 6wulKirNwC
          - - Joxp2FxLxA
        type: ConditionalNode
      - config:
          scopePath: ''
          script: |-
            payload.wk.peripheral.mb = {};

            if(payload.wk.peripherals[0] !== undefined){

                let attributes = payload.wk.peripherals[0].attributes;
                for(let i in attributes){
                    if(attributes[i].attributeTags.type !== undefined && attributes[i].attributeTags.type !== null) {
                        switch (attributes[i].attributeTags.type) {
                            case "float":
                                payload.wk.peripheral.mb[attributes[i].name] = (payload.wk.peripheral.result["t"+i][1] << 16) | payload.wk.peripheral.result["t"+i][0];
                                break;

                            case "unsigned_16":
                                payload.wk.peripheral.mb[attributes[i].name] = payload.wk.peripheral.result["t"+i][0];
                                break;

                            case "unsigned_32":
                                payload.wk.peripheral.mb[attributes[i].name] =  (payload.wk.peripheral.result["t"+i][1] << 16) | payload.wk.peripheral.result["t"+i][0];
                                break;

                            case "signed_16":
                                if(payload.wk.peripheral.result["t"+i][0] > 32767){
                                    payload.wk.peripheral.mb[attributes[i].name] = (payload.wk.peripheral.result["t"+i][0] - 65536);
                                }
                                break;

                            case "signed_32":
                                payload.wk.peripheral.mb[attributes[i].name] =  (((payload.wk.peripheral.result["t"+i][1] & 0xffff) << 16) | (payload.wk.peripheral.result["t"+i][0] & 0xffff));
                                if (payload.wk.peripheral.mb[attributes[i].name] > 2147483647) {
                                    const buf = Buffer.from(payload.wk.peripheral.mb[attributes[i].name]);
                                    payload.wk.peripheral.mb[attributes[i].name] = buf.readInt32BE();
                                }
                                break;

                            case "boolean":
                                payload.wk.peripheral.mb[attributes[i].name] = (payload.wk.peripheral.result["t"+i][0] !== undefined && payload.wk.peripheral.result["t"+i][0] > 0) ? 1 : 0;
                            default:
                                payload.wk.peripheral.mb[attributes[i].name] = payload.wk.peripheral.result["t"+i][0];
                                break;
                        }
                    }
                }
            }

            if(Object.keys(payload.wk.peripheral.mb).length > 0){
                let sql = "INSERT INTO measures (attribute, value, timestamp) VALUES ";
                let timestamp = Date.now();

                for(let i in payload.wk.peripheral.mb){
                    sql += `('${i}', ${payload.wk.peripheral.mb[i]}, ${timestamp}),`;
                }
                sql = sql.slice(0, -1);

                payload.sql = sql;
            }
        id: Joxp2FxLxA
