        id: vGKIElAE4_
        meta:
          annotationText: >
            **Atenção:** O hash MD5 é representado por 32 caracteres em
            hexadecimal, portanto a variável de saída **data.hash** deve ter no
            mínimo este tamanho.


            Resultados possíveis:

            * 0: sucesso na operação.

            * 102: o tamanho do buffer fornecido para a saída é insuficiente.
