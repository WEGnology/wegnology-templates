      - config: {}
        id: Gx1m1H_fjF
        meta:
          annotationText: >-
            Comprime o diretório *compress_dir*.


            - **data.dir** => Caminho do arquivo a ser compactado

            - **data.compressed_name** => Nome do arquivo a ser gerado,
            resultado da compactação.

            - **data.store** => Decidir se guarda ou não o arquivo de entrada no
            diretório, *true* para guardar.
          category: annotation
          height: 280
          label: Note
          name: note
          width: 260
          x: 300
          'y': 40
        outputIds: []
        type: AnnotationNode
      - config: {}
        id: 5lJw5le9Mx
        meta:
          annotationText: |-
            Possíveis retornos:
            * 0: sucesso na operação.
            * 100: caminho inválido. 
            * 101: formato de compressão não suportado.
            *  102: o caminho de entrada não existe no sistema.
            * 103: falha ao ler o arquivo de entrada.
            * 104: falha ao criar o arquivo de saída.
            * 105: falha ao gerar o arquivo compactado.
            * 106: falha ao remover o arquivo de entrada.
          category: annotation
          height: 240
          label: Note
          name: note
          width: 380
          x: 620
          'y': 380
        outputIds: []
        type: AnnotationNode
      - config: {}
        id: DvihpG1vcN
        meta:
          annotationText: '- **data.returnCode** => Retorno da operação.'
          category: annotation
          height: 100
          label: Note
          name: note
          width: 220
