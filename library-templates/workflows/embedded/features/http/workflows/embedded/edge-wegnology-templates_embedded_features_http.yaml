    flowClass: embedded
    globals: []
    id: ~exportplaceholderid-flow-edgeWegnologyTemplatesEmbeddedFeaturesHttp~
    minimumAgentVersion: 0.0.0
    name: edge-wegnology-templates\embedded\features\http
    nodes:
      - config:
          functionName: http_post
          inputs:
            - type: str
              valueTemplate: '{{data.header0}}'
            - type: str
              valueTemplate: '{{data.header1}}'
            - type: str
              valueTemplate: '{{data.header2}}'
            - type: str
              valueTemplate: '{{data.body}}'
            - type: str
              valueTemplate: '{{data.uri}}'
          outputs:
            - destinationPath: data.responseCode
              type: u16
            - destinationPath: data.responseContent
              maxLength: '25000'
              type: str
          resultPath: data.returnCode
        id: oZCQxk4_xH
        meta:
          category: data
          description: ''
