        id: BYRg6dtB96
        meta:
          category: debug
          description: ''
          label: Debug
          name: debug
          x: 140
          'y': 640
        outputIds: []
        type: DebugNode
      - config: {}
        id: FNsBAp31rr
        meta:
          annotationText: |-
            Faz uma requisição *HTTP Post* simples em um domínio

            - **data.header0** => Cabeçalho para incluir na requisição.
            - **data.header1** => Cabeçalho para incluir na requisição.
            - **data.header2** => Cabeçalho para incluir na requisição.
            - **data.body** => Dados para enviar na requisição.
            - **data.uri** => URI da requisição.
            - **data.responseCode** => Código da reposta.
            - **data.responseContent** => Resposta da requisição.
          category: annotation
          height: 360
          label: Note
          name: note
          width: 260
          x: 100
          'y': 20
        outputIds: []
        type: AnnotationNode
      - config: {}
        id: uVJqbMxqze
        meta:
          annotationText: |-
            Possíveis retornos: 
            * 0: sucesso na operação. 
            * 100: URI inválida.
            * 101: falha no envio
            da requisição.
            * 102: o tamanho do buffer fornecido para a saída é insuficiente.
            * 103: falha ao processar resposta. 
            * 104: caminho do arquivo para upload inválido.
            * 105: falha ao ler o arquivo para upload
          category: annotation
          height: 320
          label: Note
          name: note
          width: 280
          x: 380
          'y': 440
        outputIds: []
        type: AnnotationNode
      - config: {}
        id: 95N5ZZkhTT
        meta:
          annotationText: '- **data.returnCode** => Retorno da operação.'
          category: annotation
          height: 100
          label: Note
          name: note
          width: 160
          x: 380
          'y': 320
        outputIds: []
        type: AnnotationNode
      - config: {}
        id: kbwQqgOYVu
        meta:
