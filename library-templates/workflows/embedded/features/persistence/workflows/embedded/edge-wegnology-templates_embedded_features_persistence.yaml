resourceType: Flow
resources:
  - description: >-
      Este workflow realiza o armazenamento de mensagens dos períodos em que não
      há conexão com o broker remoto.

      A partir do momento que a conexão é reestabelecida, as mensagens são
      extraídas do armazenamento e publicadas.


      Para utilizá-lo, substitua o **Device State** do seu workflow por um bloco
      MQTT com o tópico **persistence**.
