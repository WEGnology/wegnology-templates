      - config:
          code: |-
            use serde_json::{Result, Value};
            let mut dec = json!("");

            let mut pl = json!({});

            if (payload["dec"].is_array()){
              let Values = json!(payload["dec"]);
              for x in 0..Values.as_array().unwrap().len(){
                pl = json!({});
                dec = json!(payload["dec"][x]);
                if (json!(dec.get("time")).is_null()){
                  let time = payload["time"].as_u64().unwrap();
                  payload["dec"][x]["time"] = json!(time/1000);
                }
                if (json!(dec.get("id")).is_null()){
                  if (json!(dec.get("topic")).is_null()){
                    payload["dec"][x]["topic"] = json!("state");
                  }
                } else {
                  if (json!(dec.get("topic")).is_null()){
                    payload["dec"][x]["topic"] = json!("edge/*/eea/peripherals");
                  }
                }
                //if (json!(dec.get("topic")).is_null()){
                //  payload["dec"][x]["topic"] = json!("state");
                //}
                //if (dec["send"].to_string().len() < 8000){
                //  payload["dec"][x]["api"] = json!("unknow");
                //} else {
                //  payload["dec"][x]["api"] =json!("modbus");
                //}
              }
              payload["topic"] = json!(payload["dec"][0]["topic"]);
              payload["array"] = json!(true);
            } else {
              dec = json!(payload["dec"]);
              if (json!(dec.get("time")).is_null()){
                let time = payload["time"].as_u64().unwrap();
                payload["dec"]["time"] = json!(time/1000);
              }
              if (json!(dec.get("id")).is_null()){
                if (json!(dec.get("topic")).is_null()){
                  payload["dec"]["topic"] = json!("state");
                }
              } else {
                if (json!(dec.get("topic")).is_null()){
                  payload["dec"]["topic"] = json!("edge/*/eea/peripherals");
                }
              }
              //if (json!(dec.get("topic")).is_null()){
              //  payload["dec"]["topic"] = json!("state");
              //}
              //if (dec["send"].to_string().len() < 8000){
              //  payload["dec"]["api"] = json!("unknow");
              //} else {
              //  payload["dec"]["api"] =json!("modbus");
              //}
              payload["topic"] = json!(payload["dec"]["topic"]);
              payload["array"] = json!(false);
            }

            //if (json!(dec.get("api")).is_null()){
            //  payload["dec"]["api"] = json!("unknow");
            //}
