      - config:
          code: |-
            use serde_json::{Result, Value};

            if (payload["isConnectedToWnology"] == json!(true)){
              if (payload["leds"]["con"] != 1 && json!(payload["data"]["delete"]).is_null()){
                payload["data"]["blink"]["leds"] = json!([{"tag": "US1:green","blinkInterval": 1250}]);
                payload["data"]["set"]["leds"] = json!([{"tag": "US1:red"}]);
                payload["leds"]["up"] = json!(0);
                payload["leds"]["con"] = json!(1);
                payload["leds"]["discon"] = json!(0);
              } else if (payload["leds"]["up"] != 1 && payload["data"]["delete"] == ""){
                payload["data"]["blink"]["leds"] = json!([{"tag": "US1:green","blinkInterval": 1000},{"ledTag": "US1:red","blinkInterval": 1000}]);
                payload["leds"]["up"] = json!(1);
                payload["leds"]["con"] = json!(0);
                payload["leds"]["discon"] = json!(0);
              }
            } else {
              if (payload["leds"]["discon"] != 1){
                payload["data"]["blink"]["leds"] = json!([{"tag": "US1:red","blinkInterval": 1250}]);
                payload["data"]["set"]["leds"] = json!([{"tag": "US1:green"}]);
                payload["leds"]["up"] = json!(0);
                payload["leds"]["con"] = json!(0);
                payload["leds"]["discon"] = json!(1);
              }
            }
