      - config:
          code: |-
            use serde_json::{Result, Value};
            let Values = json!(payload["data"]["ios"]);
            let data = json!(payload["data"]);

            for x in 0..Values.as_array().unwrap().len(){
                let mut teste = json!(Values.as_array().unwrap()[x].get("name")).to_string().replace("\"","").to_string();

                let mut id = teste.clone();
                id.push_str("Active");
                payload["device"]["value"][id.clone()] = json!(Values.as_array().unwrap()[x].get("active"));
                id = teste.clone();
                id.push_str("Ts");
                payload["device"]["value"][id.clone()] = json!(payload["data"]["timestamp"]);
                if !(json!(Values.as_array().unwrap()[x].get("counter")).is_null()){
                    id = teste.clone();
                    id.push_str("Counter");
                    payload["device"]["value"][id] = json!(Values.as_array().unwrap()[x].get("counter"));
                }
            }
