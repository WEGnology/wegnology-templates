            - **debounce_ms** => Intervalo de debounce em ms. (Opcional)

            - **report_period** => Intervalo entre as publicações periódicas.
            (Opcional) 

            - **gpio** => Objeto contendo as alterações relacionadas as portas.
            (Opcional)

            - **gpio.[].mode** => Modo de operação. (Somente entradas)
            (Opcional)

            - **gpio.[].name** => Nome de entrada definido na configuração.
            (Obrigatório)

            - **gpio.[].ref_name** => Nome de entrada descrito pelo hardware.
            (Obrigatório)

            - **gpio.[].trigger** => Trigger. (Somente Entrada) (Opcional)


            **OBS:** Os atributos dentro de *"gpio"* só se tornam obrigatórios
            quando há a presença do objeto *"gpio"* no comando.
