      - config: {}
        id: Vf20qynaCg
        meta:
          annotationText: |-
            - **endianess** => Ordem em que os bytes são armazenados.
            - **id** => ID do dispositivo.
            - **name** => Nome do dipositivo.
            - **protocol** => Tipo de comunicação com o Gateway RTC ou TCP.
            - **registers** => Variáveis do dispositivo.
            - **unitId** => Id da porta serial
          category: annotation
          height: 220
          label: Note
          name: note
          width: 260
          x: 1640
          'y': 260
        outputIds: []
        type: AnnotationNode
      - config: {}
        id: QphsqI2KTJ
        meta:
          annotationText: |
            - **interface** => Interface serial rs485 ou rs232.
            - **path** => Caminho da porta serial no linux.
            - **baud_rate** => Velocidade da comunicação serial.
            - **data_bits** => Bits dos dados, ex "5", "6", "7", "8".
            - **stop_bits** => Bits de parada, ex "1" ou "0"
            - **parity** => Paridade (“E” => Even, “O” => Odd, “N” => None)
          category: annotation
          height: 280
          label: Note
          name: note
          width: 320
          x: 1680
          'y': 840
        outputIds: []
        type: AnnotationNode
