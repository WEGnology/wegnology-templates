        meta:
          annotationText: >+
            - **report_period** => Intervalo da publicação das leituras
            periódicas.

            - **peripherals_limit** => Limite máximo de periféricos conectados.

            - **polling_read_period** => Período de guarda (ms).

            - **polling_check_period** =>  Tempo entre verificações do tempo de
            publicação. (ms)

            - **slave_connection_timeout** => Timeout de conexão com dispositivo
            escravo.

            - **onchange_pub_limit** => Limite de publicações on-change dentro

            de um ciclo periódico.

            - **onchange_guard_period** => Intervalo entre mensagens on-change.
            (ms)

          category: annotation
          height: 320
          label: Note
          name: note
          width: 360
          x: 1080
          'y': 1360
        outputIds: []
        type: AnnotationNode
