      - config: {}
        id: nUi7DXzlO_
        meta:
          annotationText: >-
            **Principais informações.**

            ****

            - **protocol** => Tipo de comunicação com o Gateway RTC ou TCP.

            - **unit_id** => Id serial da porta serial

            - **timeout** => Tempo máximo de operação.

            - **instructions** => Objeto contendo as instruções para determinar
            o que será requisitado.
          category: annotation
          height: 240
          label: Note
          name: note
          width: 360
          x: 1740
          'y': 200
        outputIds: []
        type: AnnotationNode
      - config: {}
        id: PdOdL7D5EG
        meta:
          annotationText: >
            **Atributos do "instructions".**

            ****

            - **function** => Função do comando modbus Ex.: “coil” ou "di” ou
            “ir” ou “hr”.

            - **adress** => Endereço do primeiro registrador do grupo de

            registradores na sequência.

            - **size** => Quantidade de registradores no grupo.

            - **registers** => Objeto contendo o conjunto de informações de

            resposta do registrador.
          category: annotation
          height: 240
          label: Note
          name: note
          width: 360
          x: 1740
          'y': 460
        outputIds: []
        type: AnnotationNode
      - config: {}
        id: L7hTq2bvk6
        meta:
          annotationText: >-
            **Atributos do "registers".**

            ****

            - **name** => Nome do registrador.

            - **datatype** => Descrição do tipo de dado do registrador, Ex:
            "U16", "I16", etc.

            - **scale** => Escala do registrador.

            - **on_change** => Indica se o on change está habilitado.
          category: annotation
          height: 220
          label: Note
          name: note
          width: 360
          x: 1740
          'y': 720
        outputIds: []
        type: AnnotationNode
      - config: {}
        id: CRdXdR7Oua
        meta:
          annotationText: >-
