            - **payload** => Arquivo em JSON contendo as informações
            requisitadas.

            - **value** => Valor que será escrito na função.
          category: annotation
          height: 200
          label: Note
          name: note
          width: 280
          x: 540
          'y': 580
        outputIds: []
        type: AnnotationNode
