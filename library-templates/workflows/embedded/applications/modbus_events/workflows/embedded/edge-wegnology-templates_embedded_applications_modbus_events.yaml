      - config:
          code: >-
            use serde_json::{Result, Value};

            let data = json!(payload["loop"]["value"]["registers"]);

            let device =
            json!(payload["loop"]["value"]["id"]).to_string().replace("\"","").to_string();

            //let deviceSTR = device.to_string().replace("\"","").to_string();

            let mut count = 0;

            //payload["teste"] = json!(
            json!(payload["loop"]).get("value").unwrap().as_object().unwrap().len()
            );

            if
            (json!(json!(payload["loop"]["value"]).get("registers").unwrap()).as_object().unwrap().len()
            != 0){
              payload["read"] = json!("y");
            } else {
              payload["read"] = json!("n");
            }

            payload["device"] = json!({});


            //payload["device"]["key"] = json!(payload["loop"]["key"]);

            //payload["device"]["a"][count.to_string()] =
            json!(data.as_object());

            for (register, inf) in data.as_object().unwrap() {
              //payload["device"]["b"][count.to_string()] = json!([register,inf]);
              //payload["device"][device.clone()][count.to_string()+"Name"] = json!(register);
              for (key, value) in data[register].as_object().unwrap() {
                //payload["device"]["c"][count.to_string()] = json!([key,value]);
                if (json!(payload["loop"]["value"]["id"]) == json!("")){
                  match key.as_str() {
                    "avg"=>payload["state"][register.to_string()+"Avg"] = json!(value),
                    "last"=>payload["state"][register.to_string()+"Last"] = json!(value),
                    "diff"=>payload["state"][register.to_string()+"Diff"] = json!(value),
                    "max"=>payload["state"][register.to_string()+"Max"] = json!(value),
                    "min"=>payload["state"][register.to_string()+"Min"] = json!(value),
                    "alarm_high"=>payload["state"][register.to_string()+"AHigh"] = json!(value),
                    "alarm_low"=>payload["state"][register.to_string()+"ALow"] = json!(value),
                    _ => continue
                  }
                } else {
                  match key.as_str() {
                    "avg"=>payload["device"][register.to_string()+"Avg"] = json!(value),
                    "last"=>payload["device"][register.to_string()+"Last"] = json!(value),
                    "diff"=>payload["device"][register.to_string()+"Diff"] = json!(value),
                    "max"=>payload["device"][register.to_string()+"Max"] = json!(value),
                    "min"=>payload["device"][register.to_string()+"Min"] = json!(value),
                    "alarm_high"=>payload["device"][register.to_string()+"AHigh"] = json!(value),
                    "alarm_low"=>payload["device"][register.to_string()+"ALow"] = json!(value),
                    _ => continue
                  }
                }
              }
              count = count + 1 ;
            }



            if (json!(payload["loop"]["value"]["id"]) == json!("")){
              payload["topic"] = json!("state");
            } else {
              let mut first = String::from("edge/");
              let devId = payload["loop"]["value"]["id"].to_string().replace("\"","").to_string();
              first.push_str(devId.as_str());
              let second = String::from("/eea/peripherals");
              first.push_str(second.as_str());

              payload["topic"] = json!(first);
            }
